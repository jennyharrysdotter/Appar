<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5">
  <title>Ohuhupaletten</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>Ohuhupaletten</h1>
        <p id="tagline"></p>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabs">
    <button data-view="blend"><svg viewBox="0 0 24 24"><rect x="2" y="8" width="4" height="8" rx="1.5"/><rect x="7.3" y="8" width="4" height="8" rx="1.5"/><rect x="12.6" y="8" width="4" height="8" rx="1.5"/><rect x="18" y="8" width="4" height="8" rx="1.5"/></svg><span data-t="navBlend"></span></button>
    <button data-view="palette"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.1 0 1.7-.8 1.7-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 005-5C21 6.6 17 3 12 3z" fill="none" stroke-width="2"/><circle cx="7.5" cy="11" r="1.4"/><circle cx="10" cy="7.3" r="1.4"/><circle cx="14.5" cy="7.3" r="1.4"/></svg><span data-t="navPalette"></span></button>
    <button data-view="favorites"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z" fill="none" stroke-width="2" stroke-linejoin="round"/></svg><span data-t="navFavorites"></span></button>
    <button data-view="markers"><svg viewBox="0 0 24 24"><path d="M5 19l2.5-7L16 3.5a2.1 2.1 0 013 3L10.5 15 5 19z" fill="none" stroke-width="2"/></svg><span data-t="navMarkers"></span></button>
    <button data-view="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke-width="2"/><rect x="11" y="10.5" width="2" height="7" rx="1"/><circle cx="12" cy="7.5" r="1.3"/></svg><span data-t="navInfo"></span></button>
  </nav>

  <dialog id="sheet"><div class="sheet-body" id="sheetBody"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".json,.csv,application/json,text/csv,text/plain" hidden>

  <script type="module" src="js/app.js"></script>
  <script>
    // Registrera service worker och ladda om en gång när en ny version tagit över.
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => r.update()).catch(() => {}));
      let reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded && navigator.serviceWorker.controller) { reloaded = true; location.reload(); } });
    }
  </script>
</body>
</html>
